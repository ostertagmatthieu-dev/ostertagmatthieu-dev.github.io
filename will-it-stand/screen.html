<style>
:root {
  --plum: #2C002A;
  --plum-2: #3B0B38;
  --plum-3: #4D1A49;
  --cream: #FFFCF8;
  --sand: #EFE4DC;
  --muted: #BBA8AE;
  --pink: #FF7AA0;
  --pink-deep: #E33A6A;
  --purple: #BA8BFF;
  --purple-deep: #8D43FD;
  --yellow: #FFBD7A;
  --yellow-deep: #F38F43;
  --font: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html, body { margin: 0; background: var(--plum); color: var(--cream); }
body { font-family: var(--font); font-optical-sizing: auto; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
.logo { display: inline-flex; color: var(--cream); text-decoration: none; }
.logo svg { height: 26px; width: auto; display: block; }
.conn { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.conn::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--yellow); }
.conn[data-state="live"]::before { background: #7EE3A6; box-shadow: 0 0 0 4px rgba(126, 227, 166, .18); }
.conn[data-state="down"]::before { background: var(--pink-deep); }
.ticker { background: var(--yellow); color: var(--plum); font-weight: 700; }
.ticker[hidden] { display: none; }

/* Pancake towers */
.tower { position: relative; }
.tower .pc { position: absolute; display: block; overflow: visible; }
.tower[data-color="pink"] { --pancake-color-back: var(--pink-deep); --pancake-color-front: var(--pink); }
.tower[data-color="purple"] { --pancake-color-back: var(--purple-deep); --pancake-color-front: var(--purple); }
.tower .plate { position: absolute; bottom: 0; height: 4px; border-radius: 4px; background: var(--sand); opacity: .9; }
.tower .pc.drop { animation: pc-drop .45s cubic-bezier(.2, .9, .3, 1.15) both; }
@keyframes pc-drop { from { transform: translateY(-60px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .tower .pc.drop { animation: none; }
}

html, body { height: 100%; overflow: hidden; }
body { cursor: none; }
body.pointer { cursor: default; }
.screen { position: relative; height: 100vh; width: 100vw; display: grid; grid-template-columns: minmax(0, 1fr) 23vw; grid-template-rows: auto minmax(0, 1fr) auto; column-gap: 4vw; padding: 2.6vw 3.4vw 2.4vw; }
.head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; }
.head .logo svg { height: 2.6vw; }
.head .conn { font-size: 1vw; }
.main { min-height: 0; display: flex; flex-direction: column; padding-top: 1.6vw; }
h1 { margin: 0; font-size: 5.6vw; line-height: .88; font-weight: 800; font-stretch: 75%; letter-spacing: -.02em; max-width: 17ch; text-wrap: balance; }
.duel { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3vw; padding-top: 2.4vw; }
.side { display: grid; grid-template-columns: 11vw minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto auto; column-gap: 2vw; min-height: 0; height: 100%; }
.side .tower { grid-column: 1; grid-row: 1 / 4; min-height: 0; height: 100%; }
.side .pct { grid-column: 2; grid-row: 2; font-size: 9vw; line-height: .82; font-weight: 800; font-stretch: 75%; letter-spacing: -.02em; }
.side .lab { grid-column: 2; grid-row: 3; font-size: 1.7vw; font-weight: 600; color: var(--sand); margin-top: .8vw; }
.side.yes .pct { color: var(--pink); }
.side.no .pct { color: var(--purple); }
.empty { font-size: 2vw; color: var(--muted); margin: 0 0 1vw; }

.aside { min-height: 0; display: flex; flex-direction: column; gap: 1.6vw; padding-top: 1.6vw; }
.card { background: var(--cream); color: var(--plum); border-radius: 2vw; padding: 1.8vw; display: flex; flex-direction: column; gap: 1vw; }
.qr { width: 100%; aspect-ratio: 1; }
.qr svg { width: 100%; height: 100%; display: block; }
.card .scan { font-size: 2.6vw; line-height: 1; font-weight: 800; font-stretch: 80%; }
.card .url { font-size: 1.25vw; font-weight: 600; color: #6C4B65; word-break: break-all; }
.card.closed { background: var(--purple); }
.card.closed .scan { font-size: 3.6vw; line-height: .95; }
.card.closed .url { color: var(--plum); font-size: 1.5vw; }
.clock { padding: 0 .4vw; }
.clock .lab { font-size: 1.5vw; font-weight: 600; color: var(--sand); }
.clock .big { font-size: 5vw; line-height: 1; font-weight: 800; font-stretch: 80%; color: var(--yellow); }

.strip { grid-column: 1 / -1; display: flex; gap: 4vw; align-items: baseline; border-top: 2px solid var(--plum-3); padding-top: 1.4vw; margin-top: 1.4vw; }
.stat b { font-size: 3vw; font-weight: 800; font-stretch: 80%; margin-right: .6vw; }
.stat span { font-size: 1.4vw; color: var(--sand); font-weight: 600; }
.strip .hint { margin-left: auto; font-size: 1vw; color: var(--muted); transition: opacity 1s ease; }

.ticker { position: absolute; left: 0; right: 0; bottom: 0; min-height: 7.4vw; display: flex; align-items: center; padding: 1.2vw 3.4vw; font-size: 3vw; font-weight: 800; font-stretch: 85%; line-height: 1.05; box-shadow: inset 0 .5vw 0 var(--yellow-deep); z-index: 4; }

.takeover { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) 30vw; align-items: center; gap: 3vw; padding: 3.4vw 4vw; color: var(--plum); z-index: 5; }
.takeover[hidden] { display: none; }
.takeover.stood { background: var(--yellow); }
.takeover.fell { background: var(--sand); }
.takeover .logo { color: var(--plum); position: absolute; top: 2.6vw; left: 4vw; }
.takeover .logo svg { height: 2.6vw; }
.takeover h2 { margin: 0; font-size: 13vw; line-height: .82; font-weight: 800; font-stretch: 75%; letter-spacing: -.03em; }
.takeover p { margin: 2.4vw 0 0; font-size: 3vw; line-height: 1.2; font-weight: 700; max-width: 26ch; }
.takeover .tower { height: 78vh; width: 100%; }
.takeover .stack3 { position: relative; height: 78vh; }
.takeover .stack3 .tower { position: absolute; inset: 0; }
</style>
</head>

      </div>
    </div>

        throw new Error(e && e.message ? e.message : 'HTTP ' + r.status);
      });
    }).then(function (s) {
      if (s && s.now) skew = Date.parse(s.now) - Date.now();
      return s;
    });
  }

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    (window.crypto || {}).getRandomValues ? crypto.getRandomValues(b) : b.forEach(function (_, i) { b[i] = Math.random() * 256 | 0; });
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
    return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
  }

  var memId = null;
  function deviceId() {
    try {
      var id = localStorage.getItem('wis-device');
      if (!id) { id = uuid(); localStorage.setItem('wis-device', id); }
      return id;
    } catch (e) {
      if (!memId) memId = uuid();
      return memId;
    }
  }

  function split(s) {
    var y = +s.yes || 0, n = +s.no || 0, t = y + n;
    if (!t) return { total: 0, yes: 0, no: 0 };
    var yp = Math.round(y * 100 / t);
    return { total: t, yes: yp, no: 100 - yp };
  }

  function phase(s) {
    if (s.result === 'stood') return 'stood';
    if (s.result === 'fell') return 'fell';
    if (s.status === 'frozen') return 'closed';
    return 'open';
  }

  function serverNow() { return Date.now() + skew; }

  function untilAttempt(s) {
    if (!s.attempt_at) return null;
    return Date.parse(s.attempt_at) - serverNow();
  }

  function clock(ms) {
    var t = Math.max(0, Math.round(ms / 1000));
    var h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), sec = t % 60;
    var p = function (x) { return (x < 10 ? '0' : '') + x; };
    return h ? h + ':' + p(m) + ':' + p(sec) : p(m) + ':' + p(sec);
  }

  function timeOfDay(iso) {
    try {
      return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Los_Angeles' }).replace(' ', ' ').toLowerCase();
    } catch (e) { return ''; }
  }

  function inches(cm) { return (Math.round(cm / 2.54 * 100) / 100).toFixed(2); }

  // Draws a stack of pancakes whose size follows a percentage (one pancake per 4%).
  function tower(el, pct, max) {
    max = max || 25;
    el.dataset.max = max;
    var want = pct > 0 ? Math.max(1, Math.round(pct * max / 100)) : 0;
    var have = el.querySelectorAll('.pc').length;
    var first = !el.dataset.ready;
    el.dataset.ready = '1';
    if (!el.querySelector('.plate')) {
      var plate = document.createElement('div');
      plate.className = 'plate';
      el.appendChild(plate);
    }
    while (have < want) {
      var svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('viewBox', '0 7 49 34');
      svg.setAttribute('aria-hidden', 'true');
      svg.setAttribute('class', first ? 'pc' : 'pc drop');
      var use = document.createElementNS(SVGNS, 'use');
      use.setAttribute('href', '#pc-' + (1 + (have * 7 % 3)));
      svg.appendChild(use);
      svg.dataset.i = have;
      el.appendChild(svg);
      have++;
    }
    var pcs = el.querySelectorAll('.pc');
    for (var i = pcs.length - 1; i >= want; i--) pcs[i].remove();
    layout(el, max);
  }

  function layout(el, max) {
    var W = el.clientWidth, H = el.clientHeight;
    if (!W || !H) return;
    var RISE = 0.24;
    var h = Math.min(W * 0.8 * 34 / 49, (H - 6) / (1 + (max - 1) * RISE));
    var w = h * 49 / 34;
    var step = h * RISE;
    var plate = el.querySelector('.plate');
    if (plate) { plate.style.width = (w * 1.25) + 'px'; plate.style.left = ((W - w * 1.25) / 2) + 'px'; }
    el.querySelectorAll('.pc').forEach(function (svg) {
      var i = +svg.dataset.i;
      var dx = [0, 0.035, -0.03, 0.02, -0.04, 0.03][i % 6] * W;
      svg.style.width = w + 'px';
      svg.style.height = h + 'px';
      svg.style.left = ((W - w) / 2 + dx) + 'px';
      svg.style.bottom = (2 + i * step) + 'px';
    });
  }

  function relayout() {
    document.querySelectorAll('.tower').forEach(function (t) { layout(t, +t.dataset.max || 25); });
  }
  window.addEventListener('resize', relayout);

  function poll(fn, everyMs) {
    var timer = null;
    function tick() {
      clearTimeout(timer);
      Promise.resolve().then(fn).catch(function () {}).then(function () {
        timer = setTimeout(tick, everyMs + Math.random() * 400);
      });
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    tick();
  }

  function conn(el, ok) {
    if (!el) return;
    el.dataset.state = ok ? 'live' : 'down';
    el.textContent = ok ? 'Live' : 'Reconnecting…';
  }

  return { rpc: rpc, deviceId: deviceId, split: split, phase: phase, untilAttempt: untilAttempt, clock: clock, timeOfDay: timeOfDay, inches: inches, tower: tower, poll: poll, conn: conn };
})();

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var dir = location.pathname.replace(/[^\/]*$/, '');
  var voteUrl = q.get('qr') || (location.origin + dir);
  var shown = voteUrl.replace(/^https?:\/\//, '').replace(/\/$/, '');

  (function drawQr() {
    try {
      var qr = qrcode(0, 'M');
      qr.addData(voteUrl);
      qr.make();
      $('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }).replace(/fill="black"/g, 'fill="#2C002A"').replace(/fill="white"/g, 'fill="#FFFCF8"');
    } catch (e) { $('qr').textContent = ''; }
    $('url').textContent = shown;
  })();

  var last = null;
  var lastPhase = null;

  function render(s) {
    last = s;
    var ph = WIS.phase(s);
    var sp = WIS.split(s);

    $('p-yes').textContent = (sp.total ? sp.yes : 0) + '%';
    $('p-no').textContent = (sp.total ? sp.no : 0) + '%';
    WIS.tower($('t-yes'), sp.total ? sp.yes : 0, 25);
    WIS.tower($('t-no'), sp.total ? sp.no : 0, 25);

    $('s-votes').textContent = sp.total;
    $('s-cooked').textContent = s.cooked;
    $('s-stacked').textContent = s.stacked;

    var card = $('card');
    if (ph === 'open') {
      card.classList.remove('closed');
      $('qr').hidden = false;
      $('scan').textContent = 'Scan to vote';
      $('url').textContent = shown;
    } else {
      card.classList.add('closed');
      $('qr').hidden = true;
      $('scan').textContent = 'Votes are closed';
      $('url').textContent = 'Eyes on the stack.';
    }

    if (s.ticker) { $('ticker').textContent = s.ticker; $('ticker').hidden = false; } else { $('ticker').hidden = true; }

    var t = $('takeover');
    if (ph === 'stood' || ph === 'fell') {
      t.hidden = false;
      t.className = 'takeover ' + ph;
      var h = s.final_height_cm;
      if (ph === 'stood') {
        $('r-title').textContent = 'Record broken!';
        $('r-line').textContent = (h ? h + ' cm (' + WIS.inches(h) + ' in). ' : '') + (sp.total ? sp.yes + '% of the room called it.' : '');
      } else {
        $('r-title').textContent = 'Not tonight.';
        $('r-line').textContent = 'Sydney keeps the record.' + (sp.total ? ' ' + sp.no + '% of the room saw it coming.' : '');
      }
      var win = $('t-win');
      win.dataset.color = ph === 'stood' ? 'pink' : 'purple';
      if (lastPhase !== ph) { win.innerHTML = ''; delete win.dataset.ready; growWin(win, ph === 'stood' ? 100 : 30); }
    } else {
      t.hidden = true;
    }
    lastPhase = ph;
    tickClock();
  }

  var growTimer = null;
  function growWin(el, pct) {
    clearTimeout(growTimer);
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) { el.dataset.ready = '1'; WIS.tower(el, pct, 30); return; }
    el.dataset.ready = '1';
    var p = 0;
    (function step() {
      p = Math.min(pct, p + 100 / 30);
      WIS.tower(el, p, 30);
      if (p < pct) growTimer = setTimeout(step, 70);
    })();
  }

  function tickClock() {
    if (!last) return;
    var ph = WIS.phase(last);
    var until = WIS.untilAttempt(last);
    $('stat-stacked').hidden = ph !== 'open' || last.stacked > 0;
    if (ph !== 'open') {
      $('c-lab').textContent = 'In the stack';
      $('c-big').textContent = last.stacked;
    } else if (last.stacked > 0) {
      $('c-lab').textContent = 'Stacking now. Votes close at the last pancake';
      $('c-big').textContent = last.stacked + ' in';
    } else if (until !== null && until > 0) {
      $('c-lab').textContent = 'The stack goes up in';
      $('c-big').textContent = WIS.clock(until);
    } else {
      $('c-lab').textContent = 'The stack goes up';
      $('c-big').textContent = 'Any minute';
    }
  }
  setInterval(tickClock, 1000);

  document.addEventListener('keydown', function (e) {
    if ((e.key === 'f' || e.key === 'F') && document.documentElement.requestFullscreen) {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {});
    }
  });
  var pointerTimer = null;
  document.addEventListener('mousemove', function () {
    document.body.classList.add('pointer');
    clearTimeout(pointerTimer);
    pointerTimer = setTimeout(function () { document.body.classList.remove('pointer'); }, 2500);
  });
  setTimeout(function () { $('hint').style.opacity = 0; }, 8000);

  WIS.poll(function () {
    return WIS.rpc('market_state').then(function (s) { render(s); WIS.conn($('conn'), true); }).catch(function (e) { WIS.conn($('conn'), false); throw e; });
  }, 1500);
})();
</script>
